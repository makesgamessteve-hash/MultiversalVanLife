; Multiversal Van Life - engine configuration (moddable).
[engine]
main_script = scripts/main.lua
tick_rate = 60

[render]
; vertical resolution of the retro off-screen render target
height = 240
dither = true
sky_texture = textures/sky_stars.tga

[ui]
height = 240
; portrait screens grow the UI canvas so it is at least this wide
min_width = 400
font = textures/font.tga
touch_atlas = textures/ui.tga

[input]
mouse_sensitivity = 0.0025

[save]
file = index.ini

[xr]
eye_height = 1.6

