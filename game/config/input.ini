; Multiversal Van Life - input bindings (moddable).
; action = binding, binding, ...   A leading '-' makes a binding negative.
; Key names are SDL scancode names; gamepad: pad_a, pad_b, pad_x, pad_y,
; pad_start, pad_back, pad_up/down/left/right, pad_leftx+, pad_lefty-, ...
[bindings]
move_y   = W, Up, -S, -Down, pad_lefty-, -pad_lefty+
move_x   = D, -A, pad_leftx+, -pad_leftx-
look_x   = pad_rightx+, -pad_rightx-
look_y   = pad_righty+, -pad_righty-
; turn is driven by VR controllers (smooth turning); keys [ and ] also turn
turn     = [, -]
interact = E, Space, Return, mouse1, pad_a
drop     = Q, pad_y
back     = Backspace, pad_b
menu     = Escape, Tab, pad_start
up       = W, Up, pad_up
down     = S, Down, pad_down
run      = Left Shift, pad_x
