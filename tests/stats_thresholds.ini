; Multiversal Van Life - variety thresholds (MIT License).
; Checked by `mvl_headless --stats 200 --thresholds tests/stats_thresholds.ini`
; (ctest tools.stats). Each line: metric = <= value  or  metric = >= value.
; Generation is bit-identical on every platform, so the counts are the same
; everywhere; the thresholds leave room for generators to change.
[variety]
planets = >= 180                     ; peopled worlds found among the 200 seeds
biome_distribution_share = <= 0.5    ; no biome distribution on more than half the planets
biome_distributions = >= 15
biomes = >= 15
body_plans = >= 40
body_plan_share = <= 0.2
religion_sources = >= 15
religion_source_share = <= 0.4
tech_levels = >= 6
tension_kinds = >= 7
tension_kind_share = <= 0.5
land_uses = >= 7                      ; farmland, orchards, pasture, managed forest, mines, sacred, wild, barren
settlement_ranks = >= 2               ; cities and towns (and camps of herders)
settled_planets = >= 165              ; peopled worlds whose atlas has settlements (at the coarse statistics level)
planets_with_roads = >= 150
planets_with_sea_lanes = >= 110
settlements_per_planet = >= 100
