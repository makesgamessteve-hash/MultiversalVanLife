; Multiversal Van Life - generation time budgets (MIT License).
; Checked by `mvl_headless --budget 12 --budgets tests/budgets.ini` (ctest
; tools.budget): the median time to generate one place of each level, in
; milliseconds, at the game's planet resolution. Budgets leave about five
; times the time a debug build with coverage needs on a desktop, for slow
; shared CI runners.
[budgets]
multiverse = <= 5
universe = <= 25
galaxy = <= 150
cluster = <= 15
system = <= 5
planet = <= 1000
continent = <= 10
country = <= 40
region = <= 40
land = <= 40
